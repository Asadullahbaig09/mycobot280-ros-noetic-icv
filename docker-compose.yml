version: '3.4'

# The Dockerfile is ROS Noetic only (Melodic services removed: they would silently build Noetic).
x-app: &common
  build: .
  command: [ "roslaunch ${LAUNCH_TARGET:-mycobot_280 slider_control.launch}" ]
  privileged: true
  environment:
    PYTHONUNBUFFERED: 1
    QT_X11_NO_MITSHM: 1
    DISPLAY: $DISPLAY
  volumes:
    - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
    - ".:/home/mycobot_ws/src/mycobot_ros"

services:
  # Computers with NVIDIA hardware
  nvidia-ros-noetic:
    <<: *common
    runtime: nvidia

  # Computers without NVIDIA hardware
  ros-noetic:
    <<: *common
