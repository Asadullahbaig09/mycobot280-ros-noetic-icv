# ros_control setup for the Gazebo simulation.
# Same controllers as mycobot_280m5_gazebo_gripper/config/ros_controllers.yaml,
# minus the effort PID and plus goal tolerances.
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50

# No gazebo_ros_control/pid_gains on purpose: without gains the position interface
# writes joint positions directly, so the simulated arm tracks trajectories exactly.
# (With the upstream effort PID the arm lags and MoveIt aborts with GOAL_TOLERANCE_VIOLATED.)
# Gazebo prints a harmless "No p gain specified for pid" line per joint.

arm_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - joint2_to_joint1
    - joint3_to_joint2
    - joint4_to_joint3
    - joint5_to_joint4
    - joint6_to_joint5
    - joint6output_to_joint6
  constraints:
    goal_time: 3.0                    # seconds the arm may take to settle after the trajectory ends
    stopped_velocity_tolerance: 0.05
    joint2_to_joint1: {goal: 0.01}
    joint3_to_joint2: {goal: 0.01}
    joint4_to_joint3: {goal: 0.01}
    joint5_to_joint4: {goal: 0.01}
    joint6_to_joint5: {goal: 0.01}
    joint6output_to_joint6: {goal: 0.01}

gripper_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - gripper_controller
  constraints:
    goal_time: 2.0
    stopped_velocity_tolerance: 0.05
    gripper_controller: {goal: 0.1}   # loose: the fingers may stall on the cube
